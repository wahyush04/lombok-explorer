        itinerary:
          type: object
          nullable: true
        activities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TripActivity'
        currentActivity:
          nullable: true
          $ref: '#/components/schemas/TripActivity'
        nextActivities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TripActivity'
        route:
          nullable: true
          $ref: '#/components/schemas/TripRouteData'
        routes:
          type: array
          nullable: true
          description: Persisted road route legs from database
          items:
            $ref: '#/components/schemas/TripRouteLegRecord'
        progressPercentage:
          type: integer
          nullable: true
          example: 25

