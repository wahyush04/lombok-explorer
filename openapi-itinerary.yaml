      type: object
      description: |
        Payload status pemulihan sesi live trip.
        - Jika memiliki trip aktif yang valid: `hasActiveTrip: true` beserta objek detail `session`, `itinerary`, `activities`, dsb.
        - Jika tidak ada trip aktif (atau sesi orphaned telah dibatalkan via auto-heal): `hasActiveTrip: false` dan `session: null`.
