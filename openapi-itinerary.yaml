        coverImageUrl:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1555396273-367ea4eb4db5
        address:
          type: string
          nullable: true
          example: Jl. Ade Irma Suryani No. 10, Mataram
        region:
