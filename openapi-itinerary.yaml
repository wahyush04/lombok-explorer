openapi: 3.0.3
info:
  title: Lombok Explorer - Trip & Itinerary API Specification
  description: |
    API Contract khusus untuk modul **Trip & Itinerary Management**, Multi-Day Hierarchical Planning, Stop Activities, Drag & Drop Reordering, Mapbox Route Calculation & 2-Opt Optimization, serta Public Sharing.
    
    ### Hirarki Data:
    - **Trip (Itinerary)**: Data master trip, jumlah hari, total budget, jarak, estimasi waktu perjalanan, moda transportasi, dan share link.
    - **Day (ItineraryDay)**: Hari perjalanan (`Hari 1`, `Hari 2`, dst.) dengan total jarak harian, estimasi budget harian, dan daftar stop.
    - **Stop / Activity (ItineraryItem)**: Titik perhentian pada hari tertentu, baik berupa destinasi katalog (`destinationId`) maupun lokasi bebas kustom (`customLocation`), dilengkapi urutan `orderIndex`, jam `startTime` - `endTime`, jarak/waktu dari titik sebelumnya, dan status `isCompleted`.
    - **Route & Optimization**: Perhitungan otomatis jarak/waktu antar titik dan penyusunan urutan rute paling efisien via Mapbox Optimization API (dengan fallback 2-Opt TSP).
  version: 1.0.0
  contact:
    name: Lombok Explorer Backend Engineering Team
    url: https://github.com/wahyush04/lombok-explorer
servers:
  - url: http://127.0.0.1:3000
    description: Local Development Server
  - url: http://10.0.2.2:3000
    description: Android Emulator Host
  - url: https://api.lombokexplorer.com
    description: Production Server

tags:
  - name: Curated Itineraries
    description: Penelusuran dan rekomendasi template itinerary kurasi admin untuk mobile
  - name: Itineraries
    description: Manajemen data master Trip & Itinerary pengguna
  - name: Itinerary Days
    description: Manajemen multi-hari perjalanan (Tambah, Edit, Hapus Hari)
  - name: Itinerary Activities
    description: Manajemen stops / destinasi / aktivitas dan drag & drop reordering
  - name: Itinerary Route & Optimization
    description: Optimasi rute perjalanan via Mapbox / 2-Opt Local Search
  - name: Itinerary Sharing
    description: Pembuatan share link dan akses publik trip yang dibagikan
  - name: Admin Itinerary Templates
    description: Manajemen template itinerary kurasi (Khusus Admin)
  - name: Live Trip Tracking & Execution
    description: Fitur Start Trip, pelacakan live GPS mobile, deteksi ketibaan (arrival detection), pemulihan sesi aktif, dan penyelesaian trip

paths:
  # ==========================================
  # 0. CURATED TEMPLATES (RECOMMENDATIONS & BROWSE)
  # ==========================================
  /api/v1/itineraries/recommendations:
    get:
      tags:
        - Curated Itineraries
      summary: Rekomendasi itinerary terkurasi (Mobile Home & Recommendations)
      description: Mengambil daftar template rekomendasi itinerary terpopuler yang telah dikurasi oleh admin.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: query
          name: travel_style
          schema:
            $ref: '#/components/schemas/TravelStyle'
          description: Filter gaya liburan (opsional)
        - in: query
          name: duration_days
          schema:
            type: integer
            minimum: 1
            maximum: 30
          description: Filter durasi hari spesifik (opsional)
        - in: query
          name: limit
          schema:
            type: integer
            default: 6
          description: Batas jumlah rekomendasi yang dikembalikan
      responses:
        '200':
          description: Berhasil mengambil rekomendasi itinerary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Recommended trip plans retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryTemplateCard'

  /api/v1/itineraries/browse:
    get:
      tags:
        - Curated Itineraries
      summary: Eksplorasi katalog template itinerary (Browse & Search)
      description: Menampilkan daftar template itinerary terpublikasi dengan dukungan pencarian teks, filter durasi (1-3 Hari, 4-7 Hari, >7 Hari), gaya liburan, dan paginasi.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: Kata kunci pencarian nama trip, deskripsi, atau destinasi
        - in: query
          name: duration_filter
          schema:
            type: string
            enum: [ALL, 1_3_DAYS, 4_7_DAYS, MORE_7_DAYS, 1_DAY, 2_3_DAYS, 4_PLUS_DAYS]
            default: ALL
          description: Filter kelompok durasi hari
        - in: query
          name: travel_style
          schema:
            $ref: '#/components/schemas/TravelStyle'
          description: Filter gaya liburan
        - in: query
          name: budget_level
          schema:
            $ref: '#/components/schemas/BudgetLevel'
          description: Filter estimasi anggaran
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Nomor halaman
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Jumlah item per halaman
      responses:
        '200':
          description: Berhasil mengambil daftar template itinerary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Curated trip plans retrieved successfully
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ItineraryTemplateCard'
                      pagination:
                        $ref: '#/components/schemas/PaginationMetadata'

  /api/v1/itineraries/templates/{id}:
    get:
      tags:
        - Curated Itineraries
      summary: Detail template itinerary terkurasi (Preview & Lihat Rute)
      description: Mengambil detail lengkap template perjalanan kurasi admin beserta urutan hari dan perhentian aktivitas untuk pratinjau rute sebelum diterapkan.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID template itinerary
      responses:
        '200':
          description: Detail template berhasil ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Curated trip template retrieved successfully
                  data:
                    $ref: '#/components/schemas/ItineraryTemplateDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/itineraries/apply:
    post:
      tags:
        - Curated Itineraries
      summary: Terapkan template ke trip pribadi user (Gunakan Rute Ini)
      description: |
        Menyalin (*cloning*) seluruh susunan template kurasi admin ke dalam itinerary pribadi milik pengguna yang sedang login secara atomik.
        Tanggal setiap hari perjalanan secara otomatis dihitung berdasarkan `startDate` yang dipilih.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplateRequest'
      responses:
        '201':
          description: Template berhasil diterapkan menjadi trip pribadi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Template itinerary applied successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # ADMIN TEMPLATES CRUD
  # ==========================================
  /api/v1/admin/itinerary-templates:
    get:
      tags:
        - Admin Itinerary Templates
      summary: (Admin) Daftar seluruh template itinerary
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: travel_style
          schema:
            $ref: '#/components/schemas/TravelStyle'
        - in: query
          name: is_published
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Daftar template kurasi untuk admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryTemplateDetail'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Admin Itinerary Templates
      summary: (Admin) Buat template itinerary kurasi baru
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateTemplateRequest'
      responses:
        '201':
          description: Template berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItineraryTemplateDetail'

  /api/v1/admin/itinerary-templates/{id}:
    get:
      tags:
        - Admin Itinerary Templates
      summary: (Admin) Detail template itinerary kurasi
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detail template kurasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItineraryTemplateDetail'
    patch:
      tags:
        - Admin Itinerary Templates
      summary: (Admin) Update template itinerary kurasi
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateTemplateRequest'
      responses:
        '200':
          description: Template berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItineraryTemplateDetail'
    delete:
      tags:
        - Admin Itinerary Templates
      summary: (Admin) Hapus template itinerary kurasi (Soft Delete)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Curated template deleted successfully

  # ==========================================
  # USER TRIPS CRUD
  # ==========================================
  /api/v1/itineraries:
    get:
      tags:
        - Itineraries
      summary: Mendapatkan daftar itinerary (User Trips atau Public Catalog)
      description: Mengambil daftar trip milik user yang sedang login atau trip publik jika filter `isPublic=true`.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Halaman data
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Jumlah data per halaman
        - in: query
          name: travelStyle
          schema:
            $ref: '#/components/schemas/TravelStyle'
          description: Filter gaya liburan
        - in: query
          name: budgetLevel
          schema:
            $ref: '#/components/schemas/BudgetLevel'
          description: Filter tingkatan anggaran
        - in: query
          name: transportationMode
          schema:
            $ref: '#/components/schemas/TransportationMode'
          description: Filter moda transportasi
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian berdasarkan judul atau deskripsi trip
      responses:
        '200':
          description: Berhasil mengambil daftar trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itineraries retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Itineraries
      summary: Membuat trip baru (+ initial days)
      description: Membuat trip baru. Jika `daysCount` diberikan tanpa isi `days`, backend otomatis mengenerate `daysCount` hari kosong (`Hari 1`, `Hari 2`, dst.).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItineraryRequest'
      responses:
        '201':
          description: Trip berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary trip created successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/itineraries/active:
    get:
      tags:
        - Itineraries
      summary: Mengambil ringkasan rencana trip aktif untuk Home Android
      description: |
        Mengambil kartu ringkasan trip aktif pengguna yang sedang login untuk widget "RENCANA TRIP AKTIF" di halaman Beranda aplikasi Android.
        
        - **Multi-user Isolation**: Setiap pengguna hanya mengakses trip miliknya sendiri.
        - **Pengguna Baru / Tanpa Trip**: Jika pengguna belum memiliki trip, mengembalikan status 200 dengan `hasActiveTrip: false` dan `trip: null`.
        - **Format Sesuai UI**: Menyediakan badge (`Hari 1 dari 2 Hari`), metrik jarak (`0.9 km`), moda transportasi (`CAR`), subjudul fokus (`Fokus: Hari 1: Mandalika Coastal Explorer (2 Destinasi)`), progress checklist perjalanan, serta daftar `days` dengan ID harian untuk navigasi tab hari.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Berhasil mengambil data rencana trip aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveTripResponse'
    delete:
      tags:
        - Itineraries
      summary: Menghapus trip plan aktif
      description: |
        Menghapus (soft delete) trip plan aktif milik pengguna yang sedang login.
        
        - **Cascade Cancellation**: Sebelum menghapus itinerary, backend secara otomatis membatalkan seluruh sesi live trip (`TripSession`) terkait yang berstatus `ACTIVE` atau `PAUSED` menjadi `CANCELLED` (`endedAt = now`, `currentActivityId = null`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil menghapus trip plan aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Active trip deleted successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: itin_active_123
                      deleted:
                        type: boolean
                        example: true

  /api/v1/itineraries/active/start:
    patch:
      tags:
        - Itineraries
      summary: Mengatur waktu dan tempat start trip plan aktif
      description: Mengatur tempat start (nama, koordinat, alamat) dan waktu/tanggal mulai lengkap untuk trip plan aktif, serta memperbarui waktu mulai hari pertama.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startLocation:
                  $ref: '#/components/schemas/CustomLocation'
                startDate:
                  type: string
                  format: date-time
                  example: '2026-09-10T08:30:00.000Z'
                startTime:
                  type: string
                  example: '08:30'
      responses:
        '200':
          description: Berhasil memperbarui konfigurasi awal trip aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Active trip start setup updated successfully
                  data:
                    $ref: '#/components/schemas/ActiveTripResponse'

  /api/v1/itineraries/active/days/{dayId}/start:
    patch:
      tags:
        - Itineraries
        - Itinerary Days
      summary: Mengatur titik awal hari tertentu pada active trip
      description: Alias untuk endpoint `/api/v1/itineraries/{id}/days/{dayId}/start` pada trip yang sedang aktif.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: dayId
          required: true
          schema:
            type: string
          description: ID Hari (ItineraryDay)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDayStartRequest'
      responses:
        '200':
          description: Titik awal hari active trip berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Day start location and time updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  /api/v1/itineraries/active-trip:
    get:
      tags:
        - Itineraries
      summary: Alias mengambil ringkasan rencana trip aktif untuk Home Android
      description: |
        Endpoint alias identik dengan `/api/v1/itineraries/active`. Digunakan oleh klien Android untuk widget Home dan navigasi langsung ke detail/hari trip aktif.
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          description: Berhasil mengambil data rencana trip aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveTripResponse'
    delete:
      tags:
        - Itineraries
      summary: Alias menghapus trip plan aktif
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil menghapus trip plan aktif

  /api/v1/itineraries/generate:
    post:
      tags:
        - Itineraries
      summary: Smart Generator Rekomendasi Itinerary Otomatis
      description: Menghasilkan rekomendasi rencana perjalanan lengkap berdasarkan gaya liburan, tempo perjalanan, dan jumlah hari.
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totalDays
                - travelStyle
                - startDate
                - endDate
              properties:
                title:
                  type: string
                  example: 3 Hari Liburan Bahari Lombok
                totalDays:
                  type: integer
                  minimum: 1
                  maximum: 14
                  example: 3
                travelStyle:
                  $ref: '#/components/schemas/TravelStyle'
                budgetLevel:
                  $ref: '#/components/schemas/BudgetLevel'
                pace:
                  type: string
                  enum: [RELAXED, MODERATE, INTENSE]
                  default: MODERATE
                transportation:
                  type: string
                  enum: [CAR, MOTORCYCLE, PUBLIC_BOAT]
                  default: CAR
                travelersCount:
                  type: integer
                  default: 2
                startDate:
                  type: string
                  format: date
                  example: '2026-09-01'
                endDate:
                  type: string
                  format: date
                  example: '2026-09-03'
                saveItinerary:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Itinerary otomatis berhasil digenerate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Smart itinerary generated successfully
                  data:
                    type: object
                    properties:
                      itinerary:
                        $ref: '#/components/schemas/ItineraryResponse'
                      summary:
                        type: object

  /api/v1/itineraries/{id}:
    get:
      tags:
        - Itineraries
      summary: Mengambil detail lengkap trip / itinerary
      description: Mengambil informasi trip, daftar multi-hari, dan daftar aktivitas/stop per hari secara terurut beserta segmen rute.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Itinerary
      responses:
        '200':
          description: Detail trip berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary detail retrieved successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Itineraries
      summary: Mengubah informasi master trip
      description: Mengubah judul, deskripsi, tanggal, moda transportasi, atau preferensi trip.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          description: Trip berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Itineraries
      summary: Mengubah informasi master trip (PUT)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          description: Trip berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

    delete:
      tags:
        - Itineraries
      summary: Menghapus trip
      description: |
        Menghapus (soft delete) trip milik pengguna.
        
        - **Cascade Cancellation**: Sebelum menghapus itinerary, backend secara otomatis membatalkan seluruh sesi live trip (`TripSession`) terkait yang berstatus `ACTIVE` atau `PAUSED` menjadi `CANCELLED` (`endedAt = now`, `currentActivityId = null`).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary deleted successfully

  /api/v1/itineraries/{id}/duplicate:
    post:
      tags:
        - Itineraries
      summary: Menduplikasi / Meng-clone trip
      description: Membuat salinan trip lengkap beserta hari dan seluruh aktivitas ke akun user saat ini.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Trip berhasil diduplikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Itinerary duplicated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  /api/v1/itineraries/{id}/share:
    post:
      tags:
        - Itinerary Sharing
      summary: Membuat Link Share Trip
      description: Mengenerate `shareToken` unik dan mengembalikan URL share publik trip.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link share berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Share link generated successfully
                  data:
                    type: object
                    properties:
                      shareToken:
                        type: string
                        example: a8f7b2c91d4e5f60
                      shareUrl:
                        type: string
                        example: https://lombokexplorer.com/trips/share/a8f7b2c91d4e5f60

  /api/v1/shared/itineraries/{shareToken}:
    get:
      tags:
        - Itinerary Sharing
      summary: Mengambil Trip yang Dishare (Publik tanpa Auth)
      description: Endpoint publik untuk membuka trip yang dibagikan melalui share link.
      parameters:
        - in: path
          name: shareToken
          required: true
          schema:
            type: string
          description: Token share trip
      responses:
        '200':
          description: Trip berhasil dimuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Shared itinerary retrieved successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # DAY MANAGEMENT
  # ----------------------------------------------------
  /api/v1/itineraries/{id}/days:
    post:
      tags:
        - Itinerary Days
      summary: Menambahkan hari baru ke trip (+ Tambah Hari)
      description: Menambahkan hari di urutan terakhir trip (`Hari N+1`).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDayRequest'
      responses:
        '201':
          description: Hari berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Day added to itinerary successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  /api/v1/itineraries/{id}/days/{dayId}:
    patch:
      tags:
        - Itinerary Days
      summary: Mengubah data hari (Judul, Catatan, Tanggal)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDayRequest'
      responses:
        '200':
          description: Hari berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Day updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

    delete:
      tags:
        - Itinerary Days
      summary: Menghapus hari (Hapus Hari)
      description: Menghapus hari beserta seluruh perhentian di dalamnya, lalu secara otomatis mengurutkan ulang (re-indexing) nomor hari yang tersisa (`Hari 1`, `Hari 2`, ...).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hari berhasil dihapus dan hari tersisa berhasil di-reindex
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Day deleted and re-indexed successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  /api/v1/itineraries/{id}/days/{dayId}/start:
    patch:
      tags:
        - Itinerary Days
      summary: Mengatur titik awal keberangkatan & jam mulai hari tertentu
      description: |
        Mengubah titik start harian secara fleksibel:
        - Bisa menggunakan referensi ID yang sudah ada (`destinationId`, `accommodationId`, atau `restaurantId`).
        - Bisa menggunakan titik custom koordinat (`name`, `latitude`, `longitude`, `address`).
        - Jika `startLocation: null`, sistem akan mereset kembali ke chaining otomatis (aktivitas terakhir dari hari sebelumnya, atau start trip pada Hari 1).
        Perubahan titik start hari ini akan secara otomatis memperbarui rute hari ini dan mengalirkan pembaruan ke hari-hari berikutnya yang terikat secara otomatis.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Trip Itinerary atau 'active' untuk active trip pengguna
        - in: path
          name: dayId
          required: true
          schema:
            type: string
          description: ID Hari (ItineraryDay)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDayStartRequest'
      responses:
        '200':
          description: Titik awal dan rute hari berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Day start location and time updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  # ----------------------------------------------------
  # ACTIVITY / STOP MANAGEMENT
  # ----------------------------------------------------
  /api/v1/itineraries/{id}/days/{dayId}/activities:
    post:
      tags:
        - Itinerary Activities
      summary: Menambahkan stop / aktivitas pada suatu hari (+ Tambah Destinasi)
      description: Menambahkan perhentian wisata (berdasarkan `destinationId` katalog ataupun lokasi kustom `customLocation`). Backend otomatis menghitung jarak, waktu tempuh dari stop sebelumnya, dan jadwal waktu (`Asia/Makassar` WITA).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddActivityRequest'
      responses:
        '201':
          description: Stop berhasil ditambahkan dan rute dihitung ulang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Stop activity added successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

    put:
      tags:
        - Itinerary Activities
      summary: Menyimpan Urutan Baru Stops (Drag & Drop Reorder)
      description: Menerima urutan baru daftar `activityId` beserta `orderIndex` hasil interaksi drag & drop di Android. Backend otomatis memperbarui urutan dan menghitung ulang segmen rute serta estimasi jam.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderActivitiesRequest'
      responses:
        '200':
          description: Urutan stops berhasil disimpan dan rute diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Stop activities reordered and route recalculation completed
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  /api/v1/itineraries/{id}/days/{dayId}/activities/{activityId}:
    patch:
      tags:
        - Itinerary Activities
      summary: Mengedit stop atau toggle status checklist (isCompleted)
      description: Mengubah estimasi durasi, budget, catatan, atau toggle checklist `isCompleted` (Persistent).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
        - in: path
          name: activityId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Stop berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Stop activity updated successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

    delete:
      tags:
        - Itinerary Activities
      summary: Menghapus stop / destinasi dari hari
      description: Menghapus stop, mengurutkan ulang orderIndex aktivitas yang tersisa, dan menghitung ulang segmen rute harian.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: dayId
          required: true
          schema:
            type: string
        - in: path
          name: activityId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stop berhasil dihapus dan rute dihitung ulang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Stop activity deleted and route recalculation completed
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  # ----------------------------------------------------
  # ROUTE OPTIMIZATION
  # ----------------------------------------------------
  /api/v1/itineraries/{id}/optimize:
    post:
      tags:
        - Itinerary Route & Optimization
      summary: Mengoptimalkan Urutan Rute Perjalanan (Optimasi Rute)
      description: Menggunakan Mapbox Optimization API (dan 2-Opt local search TSP) untuk mencari urutan rute dengan jarak dan waktu perjalanan paling minimum.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeItineraryRequest'
      responses:
        '200':
          description: Optimasi rute berhasil dilakukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Route optimization completed successfully
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'

  # ==========================================
  # 8. LIVE TRIP TRACKING & EXECUTION
  # ==========================================
  /api/v1/itineraries/{id}/start-trip:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Start a live trip session for an itinerary
      description: |
        Memulai sesi perjalanan aktif (`TripSession`) untuk itinerary tertentu.
        **PENTING**: Memulai trip **TIDAK MENGUNCI** itinerary. Pengguna tetap bebas menambah, menghapus, atau mengedit stop saat trip sedang aktif.
        API ini menginisialisasi status progres setiap aktivitas, menentukan aktivitas awal yang harus dituju, menghitung polyline & segmen rute, dan mengembalikan data lengkap untuk rendering map Android secara instan.
        Permintaan start trip yang duplikat pada trip yang sama bersifat idempoten (mengembalikan sesi aktif yang sedang berjalan).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID itinerary yang akan dijalankan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTripRequest'
      responses:
        '201':
          description: Trip session berhasil dimulai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Trip session started successfully
                  data:
                    $ref: '#/components/schemas/StartTripResponse'
        '400':
          description: Itinerary tidak memiliki aktivitas atau destinasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: EMPTY_ITINERARY
                  errorCode:
                    type: string
                    example: EMPTY_ITINERARY
                  message:
                    type: string
                    example: Itinerary tidak memiliki aktivitas atau destinasi untuk dimulai.
                  data:
                    nullable: true
                    example: null
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Pengguna sudah memiliki perjalanan yang sedang aktif di itinerary lain
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: ACTIVE_SESSION_EXISTS
                  errorCode:
                    type: string
                    example: ACTIVE_SESSION_EXISTS
                  message:
                    type: string
                    example: Pengguna sudah memiliki perjalanan yang sedang aktif.
                  data:
                    type: object
                    properties:
                      activeSessionId:
                        type: string
                        format: uuid
                        example: 2eb6d10f-cf87-43cf-bc07-0b1a0e167f40
                      itineraryId:
                        type: string
                        format: uuid
                        example: 3cb1edc3-18b7-4596-8358-bf3669cff2f6

  /api/v1/trip-sessions/start:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Start trip session (Alternative route)
      description: Memulai sesi trip via body payload `itineraryId`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTripRequest'
      responses:
        '201':
          description: Trip session berhasil dimulai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Trip session started successfully
                  data:
                    $ref: '#/components/schemas/StartTripResponse'
        '400':
          description: Itinerary tidak memiliki aktivitas atau destinasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: EMPTY_ITINERARY
                  errorCode:
                    type: string
                    example: EMPTY_ITINERARY
                  message:
                    type: string
                    example: Itinerary tidak memiliki aktivitas atau destinasi untuk dimulai.
                  data:
                    nullable: true
                    example: null
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Pengguna sudah memiliki perjalanan yang sedang aktif di itinerary lain
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: ACTIVE_SESSION_EXISTS
                  errorCode:
                    type: string
                    example: ACTIVE_SESSION_EXISTS
                  message:
                    type: string
                    example: Pengguna sudah memiliki perjalanan yang sedang aktif.
                  data:
                    type: object
                    properties:
                      activeSessionId:
                        type: string
                        format: uuid
                        example: 2eb6d10f-cf87-43cf-bc07-0b1a0e167f40
                      itineraryId:
                        type: string
                        format: uuid
                        example: 3cb1edc3-18b7-4596-8358-bf3669cff2f6

  /api/v1/trip-sessions/active:
    get:
      tags:
        - Live Trip Tracking & Execution
      summary: Restore active trip session (Mobile Recovery)
      description: |
        Mengambil data sesi trip aktif pengguna untuk memulihkan tampilan peta pelacakan Android setelah aplikasi dibuka kembali atau restart.
        
        - **Auto-Heal Orphaned Session**: Jika sesi aktif ditemukan tetapi itinerary fisiknya sudah dihapus (`deletedAt !== null` atau tidak ditemukan), backend secara otomatis membatalkan sesi tersebut (`status: CANCELLED`) dan mengembalikan `hasActiveTrip: false` serta `session: null`.
        - **Format Respons**:
          - Jika sesi aktif valid: mengembalikan `hasActiveTrip: true` beserta detail lengkap `session`, `itinerary`, `activities`, `currentActivity`, dan data `route`.
          - Jika tidak ada sesi aktif (atau setelah auto-heal): mengembalikan `hasActiveTrip: false` dan `session: null`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sesi aktif berhasil dipulihkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Active trip session retrieved successfully
                  data:
                    $ref: '#/components/schemas/ActiveTripRecoveryResponse'

  /api/v1/trip-sessions/{id}:
    get:
      tags:
        - Live Trip Tracking & Execution
      summary: Get trip session detail by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail sesi trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/location:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Sync user location & auto-detect arrival
      description: |
        Menyinkronkan koordinat GPS terkini pengguna.
        Jika `arrivalDetected: true`, backend memvalidasi jarak pengguna ke target destinasi (`Haversine distance <= arrivalRadiusMeters + buffer`).
        Jika terverifikasi valid, status aktivitas diperbarui menjadi `COMPLETED` dan `currentActivityId` otomatis berpindah ke aktivitas berikutnya.
        Jika aktivitas terakhir diselesaikan, sesi trip otomatis beralih ke status `COMPLETED`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncLocationRequest'
      responses:
        '200':
          description: Lokasi berhasil disinkronkan dan progres diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Trip location synced successfully
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/activities/{activityId}/complete:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Manually mark an activity as completed
      description: Menandai aktivitas spesifik sebagai selesai (idempoten dan aman terhadap percobaan ulang offline).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: activityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteActivityRequest'
      responses:
        '200':
          description: Aktivitas berhasil diselesaikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/activities/{activityId}/start:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Mark an activity as in progress
      description: Menandai aktivitas spesifik sebagai sedang berlangsung (IN_PROGRESS) dan memperbarui currentActivityId sesi trip.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: activityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartActivityRequest'
      responses:
        '200':
          description: Aktivitas berhasil dimulai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/activities/{activityId}/skip:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Skip an activity
      description: Melewati aktivitas spesifik (SKIPPED) dan memajukan currentActivityId ke aktivitas berikutnya.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: activityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipActivityRequest'
      responses:
        '200':
          description: Aktivitas berhasil dilewati
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/finish:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Finish an active trip session
      description: Menyelesaikan sesi trip secara manual dan menyetel waktu `endedAt`.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sesi trip selesai
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

  /api/v1/trip-sessions/{id}/cancel:
    post:
      tags:
        - Live Trip Tracking & Execution
      summary: Cancel an active trip session
      description: Membatalkan sesi trip aktif (`CANCELLED`).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sesi trip dibatalkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StartTripResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token JWT

  schemas:
    TravelStyle:
      type: string
      enum:
        - NATURE_ADVENTURE
        - BEACH_RELAXATION
        - CULTURAL_HISTORICAL
        - CULINARY
        - LUXURY_RESORT
        - BUDGET_BACKPACKER
        - FAMILY_FRIENDLY
        - WATER_SPORTS
