        1. Mengambil dari data katalog yang sudah ada: kirim `destinationId`, `accommodationId`, atau `restaurantId`.
        2. Custom location: kirim `name`, `latitude`, `longitude`, dan opsional `address`.
      properties:
        destinationId:
          type: string
          nullable: true
          example: dest_123456
          description: Mengambil data titik awal dari destinasi katalog yang sudah ada
        accommodationId:
          type: string
          nullable: true
          example: accom_123456
          description: Mengambil data titik awal dari penginapan/hotel katalog yang sudah ada
        restaurantId:
          type: string
          nullable: true
          example: rest_123456
          description: Mengambil data titik awal dari restoran katalog yang sudah ada
        name:
          type: string
          example: Villa Ombak Gili Trawangan
          description: Nama lokasi custom (wajib jika custom)
        latitude:
          type: number
          example: -8.3512
          description: Latitude lokasi custom (wajib jika custom)
        longitude:
          type: number
          example: 116.0421
          description: Longitude lokasi custom (wajib jika custom)
        address:
          type: string
          nullable: true
          example: Gili Trawangan, Pemenang, Lombok Utara

