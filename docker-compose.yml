services:
  # Container 1: Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: lombok_explorer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-lombok_explorer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lombok_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-lombok_explorer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Container 2: Backend API Service (Node.js Express + TypeScript + Prisma)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lombok_explorer_backend
    restart: unless-stopped
    ports:
      - "3000:8080"
      - "8080:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      HOST: 0.0.0.0
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-root}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-lombok_explorer}?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-lombok_explorer_super_secret_access_jwt_key_2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-lombok_explorer_super_secret_refresh_jwt_key_2026}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-e98c7ab33f21494199425936251005}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-wahyush04.colab@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-lombokExplorer@2026}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin Lombok Explorer}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-167522607878-rucuu043eshc4ou6k22ruc2fs8kh5f29.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-lombok-explorer}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-tzccdgab}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-649313611264454}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-mjc_HBPF5rpPXsDV-Th2XkEojKs}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-lombok-explorer}
    volumes:
      - assets_data:/app/assets/image
    networks:
      - lombok_network
    depends_on:
      db:
        condition: service_healthy

networks:
  lombok_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  assets_data:
    driver: local
