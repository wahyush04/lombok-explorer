services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: lombok_explorer_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-lombok_explorer}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend API Service (Node.js Express + TypeScript + Prisma)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lombok_explorer_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      HOST: 0.0.0.0
      API_PREFIX: ${API_PREFIX:-/v1}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:root@db:3306/lombok_explorer}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-lombok_explorer_super_secret_access_jwt_key_2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-lombok_explorer_super_secret_refresh_jwt_key_2026}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-e98c7ab33f21494199425936251005}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
    volumes:
      - assets_data:/app/assets/image
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    driver: local
  assets_data:
    driver: local
