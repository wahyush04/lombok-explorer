services:
  # Container 1: Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: lombok_explorer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lombokexplorerdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-S2vjv3I7BXmTgOZzr7C9}
      POSTGRES_DB: ${DB_NAME:-lombokexplorerdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lombok_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lombokexplorerdb} -d ${DB_NAME:-lombokexplorerdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Container 2: Backend API Service (Node.js Express + TypeScript + Prisma)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lombok_explorer_backend
    restart: unless-stopped
    ports:
      - "3000:8080"
      - "8080:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      HOST: 0.0.0.0
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-lombokexplorerdb}:${DB_PASSWORD:-S2vjv3I7BXmTgOZzr7C9}@db:5432/${DB_NAME:-lombokexplorerdb}?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-030e970e1b696519f8e8db3e756c93a7c42840b054f3ec24f017e270fd375a8f0b4c104e162c756461f8be92e0ea0e19ec6eba7d0a81263fb4a76d9de41b1147}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-362acb13371c55fb706860492bd20a7ff361e893804701ce2a30ad6b58959cc77b74fd296c62d55c25988a3abd0cb14fbc46cb5cb1292a7b73d2fd582001d02d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-e98c7ab33f21494199425936251005}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.weatherapi.com/v1}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-600}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-wahyush04@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-lombokExplorer@2026}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin Lombok Explorer}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-167522607878-rucuu043eshc4ou6k22ruc2fs8kh5f29.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-lombok-explorer}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-tzccdgab}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-649313611264454}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-mjc_HBPF5rpPXsDV-Th2XkEojKs}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-lombok-explorer}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-sk.eyJ1Ijoid2FoeXVzaDA0IiwiYSI6ImNtdDhodGNoejAwNWwyd3F4NmxvZ2ZjMWoifQ.T4OIpSQnCSnqgzCm-4ZSug}
      MAPBOX_SECRET_TOKEN: ${MAPBOX_SECRET_TOKEN:-sk.eyJ1Ijoid2FoeXVzaDA0IiwiYSI6ImNtdDhodGNoejAwNWwyd3F4NmxvZ2ZjMWoifQ.T4OIpSQnCSnqgzCm-4ZSug}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-pk.eyJ1Ijoid2FoeXVzaDA0IiwiYSI6ImNtdDhobDNrZDAwZXAyeHFvdThzcHZma2wifQ.VRahPg2VZXDapx66cjiB3g}
    volumes:
      - assets_data:/app/assets/image
    networks:
      - lombok_network
    depends_on:
      db:
        condition: service_healthy

networks:
  lombok_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  assets_data:
    driver: local
