# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token for authorized requests

  responses:
    BadRequestError:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Invalid query parameters"
            errorCode: "BAD_REQUEST"
    UnauthorizedError:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Unauthorized access, please login"
            errorCode: "UNAUTHORIZED"
    ForbiddenError:
      description: Forbidden - Insufficient permissions or role requirement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "You do not have permission to access this resource"
            errorCode: "FORBIDDEN"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Destination not found"
            errorCode: "NOT_FOUND"
    ConflictError:
      description: Conflict with existing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Resource already exists"
            errorCode: "CONFLICT"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Internal server error occurred"
            errorCode: "INTERNAL_SERVER_ERROR"
    ActionSuccessResponse:
      description: Action completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionSuccessResponse'
          example:
            success: true
            message: "Action completed successfully"

  schemas:
    # --- COMMON / META SCHEMAS ---
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 28
        totalPages:
          type: integer
          example: 3

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Resource not found"
        errorCode:
          type: string
          example: "DESTINATION_NOT_FOUND"
        details:
          type: array
          items:
            type: string
          nullable: true

    ForbiddenError:
      type: object
      required:
        - success
        - message
        - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "You do not have permission to access this resource"
        errorCode:
          type: string
          example: "FORBIDDEN"
        details:
          type: array
          items:
            type: string
          nullable: true

    ActionSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Action completed successfully"

    StandardActionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    # --- ENUMS ---
    LombokRegion:
      type: string
      enum:
        - LOMBOK_SELATAN   # Kuta, Mandalika, Tanjung Aan, Merese, Mawun, Selong Belanak
        - LOMBOK_UTARA     # Senaru, Rinjani, Tiu Kelep, Bayan, Gili Islands
        - LOMBOK_BARAT     # Senggigi, Malimbu, Sekotong, Batu Layar
        - LOMBOK_TIMUR     # Sembalun, Pink Beach, Tetebatu
        - LOMBOK_TENGAH    # Sade, Sukarara, Praya
        - GILI_ISLANDS     # Trawangan, Meno, Air
      example: "LOMBOK_SELATAN"

    DifficultyLevel:
      type: string
      enum:
        - EASY
        - MODERATE
        - CHALLENGING
        - EXTREME
      example: "EASY"

    TravelStyle:
      type: string
      enum:
        - NATURE_ADVENTURE
        - BEACH_RELAXATION
        - CULTURE_HERITAGE
        - CULINARY_EXPLORER
        - PHOTOGRAPHY_SPOTS
        - FAMILY_FRIENDLY
      example: "BEACH_RELAXATION"

    BudgetLevel:
      type: string
      enum:
        - BUDGET
        - MID_RANGE
        - LUXURY
      example: "MID_RANGE"

    # --- AUTH & USER SCHEMAS ---
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
      example: "USER"

    UserDto:
      type: object
      required:
        - id
        - email
        - name
        - role
        - travelStyle
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "usr_demo_lombok"
        email:
          type: string
          format: email
          example: "traveler@lombokexplorer.com"
        name:
          type: string
          example: "Wahyu Traveler"
        avatarUrl:
          type: string
          nullable: true
          example: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200"
        bio:
          type: string
          nullable: true
          example: "Travel enthusiast passionate about exploring tropical beaches & waterfalls."
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        role:
          $ref: '#/components/schemas/UserRole'
        travelStyle:
          $ref: '#/components/schemas/TravelStyle'
        preferences:
          type: array
          items:
            type: string
          example: ["Snorkeling", "Sunset Point", "Culinary"]
        createdAt:
          type: string
          format: date-time
          example: "2026-08-23T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-23T08:00:00.000Z"

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Wahyu Traveler"
        email:
          type: string
          format: email
          example: "traveler@lombokexplorer.com"
        password:
          type: string
          minLength: 6
          example: "SuperSecret123!"
        travelStyle:
          $ref: '#/components/schemas/TravelStyle'
        bio:
          type: string
          maxLength: 500
          example: "Travel enthusiast passionate about exploring tropical beaches & waterfalls."
        avatarUrl:
          type: string
          example: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200"
        phone:
          type: string
          example: "+6281234567890"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "traveler@lombokexplorer.com"
        password:
          type: string
          example: "SuperSecret123!"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    GoogleAuthRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: Raw Google ID Token string obtained from Google Sign-In SDK
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1NiJ9..."

    GoogleAuthData:
      type: object
      required:
        - status
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        status:
          type: string
          enum:
            - LOGIN_SUCCESS
            - NEED_REGISTRATION
          example: "LOGIN_SUCCESS"
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserDto'

    GoogleAuthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          $ref: '#/components/schemas/GoogleAuthData'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Wahyu Traveler"
        avatarUrl:
          type: string
          example: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200"
        bio:
          type: string
          maxLength: 500
          example: "Travel enthusiast passionate about exploring tropical beaches & waterfalls."
        phone:
          type: string
          example: "+6281234567890"
        travelStyle:
          $ref: '#/components/schemas/TravelStyle'
        preferences:
          type: array
          items:
            type: string
          example: ["Snorkeling", "Sunset Point", "Culinary"]

    AuthTokenData:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserDto'

    AuthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Authentication successful"
        data:
          $ref: '#/components/schemas/AuthTokenData'

    UserProfileResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "User profile retrieved successfully"
        data:
          $ref: '#/components/schemas/UserDto'

    SystemHealthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Lombok Explorer API is operational"
        data:
          type: object
          required:
            - status
            - timestamp
            - uptime
            - environment
            - database
          properties:
            status:
              type: string
              example: "healthy"
            timestamp:
              type: string
              format: date-time
              example: "2026-08-23T08:00:00.000Z"
            uptime:
              type: number
              example: 124.5
            environment:
              type: string
              example: "production"
            database:
              type: object
              required:
                - connected
                - latencyMs
              properties:
                connected:
                  type: boolean
                  example: true
                latencyMs:
                  type: number
                  example: 1.25

    # --- DESTINATION SCHEMAS ---
    DestinationDto:
      type: object
      required:
        - id
        - name
        - shortDescription
        - description
        - categoryId
        - categoryName
        - region
        - locationName
        - latitude
        - longitude
        - rating
        - reviewCount
        - entranceFee
        - openingHours
        - estimatedDurationMinutes
        - bestVisitingTime
        - difficulty
        - tags
        - images
        - coverImageUrl
        - facilities
        - isFeatured
        - isFavorite
      properties:
        id:
          type: string
          example: "dest_tanjung_aan"
        name:
          type: string
          example: "Pantai Tanjung Aan"
        shortDescription:
          type: string
          example: "Pantai berpasir putih merica dengan panorama teluk toska memukau di Mandalika."
        description:
          type: string
          example: "Pantai Tanjung Aan adalah salah satu pantai paling ikonik di Lombok Selatan dengan formasi pasir bulat seperti biji merica dan air laut berwarna toska bergradasi. Dikelilingi oleh perbukitan hijau seperti Bukit Merese, tempat ini ideal untuk berenang, bersantai, dan menikmati pemandangan matahari terbenam."
        categoryId:
          type: string
          example: "cat_beach"
        categoryName:
          type: string
          example: "Pantai & Pesisir"
        region:
          $ref: '#/components/schemas/LombokRegion'
        locationName:
          type: string
          example: "Pujut, Lombok Tengah"
        latitude:
          type: number
          format: double
          example: -8.9083
        longitude:
          type: number
          format: double
          example: 116.3218
        rating:
          type: number
          format: float
          example: 4.8
        reviewCount:
          type: integer
          example: 1420
        entranceFee:
          type: number
          example: 10000
        currency:
          type: string
          default: "IDR"
          example: "IDR"
        openingHours:
          type: string
          example: "06:00 - 18:30 WITA"
        estimatedDurationMinutes:
          type: integer
          example: 120
        bestVisitingTime:
          type: string
          example: "Pagi hari (08:00) atau menjelang Sunset (16:30)"
        difficulty:
          $ref: '#/components/schemas/DifficultyLevel'
        tags:
          type: array
          items:
            type: string
          example: ["Pasir Merica", "Sunset Spot", "Berenang", "Fotografi", "Mandalika"]
        coverImageUrl:
          type: string
          example: "https://images.unsplash.com/photo-1544644181-1484b3fdfc62?q=80&w=1000"
        images:
          type: array
          items:
            type: string
          example:
            - "https://images.unsplash.com/photo-1544644181-1484b3fdfc62?q=80&w=1000"
            - "https://images.unsplash.com/photo-1570789210967-2cac24afeb00?q=80&w=1000"
        facilities:
          type: array
          items:
            type: string
          example: ["Area Parkir", "Warung Lokal & Kelapa Muda", "Toilet", "Sewa Gazebo", "Spot Foto"]
        tips:
          type: array
          items:
            type: string
          example:
            - "Kombinasikan kunjungan dengan mendaki Bukit Merese untuk sunset."
            - "Gunakan alas kaki yang nyaman jika ingin mendaki bukit sekitar."
        isFeatured:
          type: boolean
          example: true
        isFavorite:
          type: boolean
          example: false

    NearbyDestinationDto:
      allOf:
        - $ref: '#/components/schemas/DestinationDto'
        - type: object
          required:
            - distanceKm
          properties:
            distanceKm:
              type: number
              format: float
              example: 3.4

    DestinationListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Success fetching destinations"
        data:
          type: array
          items:
            $ref: '#/components/schemas/DestinationDto'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    NearbyDestinationListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Success fetching nearby destinations"
        data:
          type: array
          items:
            $ref: '#/components/schemas/NearbyDestinationDto'

    DestinationDetailResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Success fetching destination detail"
        data:
          $ref: '#/components/schemas/DestinationDto'

    # --- CATEGORY SCHEMAS ---
    CategoryDto:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - iconName
        - destinationCount
        - coverImageUrl
      properties:
        id:
          type: string
          example: "cat_beach"
        name:
          type: string
          example: "Pantai & Pesisir"
        slug:
