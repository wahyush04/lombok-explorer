openapi: 3.0.3
info:
  title: Lombok Explorer API
  description: |
    API Contract untuk Lombok Explorer — Platform eksplorasi wisata, rekomendasi cerdas, 
    dan perencanaan perjalanan (itinerary planner) pulau Lombok, Nusa Tenggara Barat.
  version: 1.0.0
  contact:
    name: Lombok Explorer Team
    email: support@lombokexplorer.com

servers:
  - url: https://api.lombokexplorer.com/api/v1
    description: Production Server (v1)
  - url: http://localhost:8080/api/v1
    description: Local Development Server (v1)
  - url: http://localhost:8080/v1
    description: Legacy Compatibility Alias Server

tags:
  - name: Authentication
    description: User authentication, JWT issuance, password login, and session management
  - name: Google Authentication
    description: Google Sign-In with ID Token verification and complete registration flow
  - name: Account Linking
    description: Managing and linking multiple authentication methods to a single user account
  - name: Weather
    description: Live weather data and forecasts for Lombok regions and tourism spots
  - name: Health
    description: System health and readiness probes
  - name: Destinations
    description: Tourism destination discovery, filtering, and search
  - name: Categories
    description: Destination categories and classifications
  - name: Itineraries
    description: Travel itinerary planning and generation
  - name: Reviews
    description: Destination reviews and ratings
  - name: Feeds & Community
    description: Social feeds timeline, travel posts, media attachments, likes, comments, bookmarks, and sharing
  - name: Device Tokens
    description: Registration and management of FCM device tokens for mobile push notifications
  - name: Notifications
    description: In-app user notifications, unread count tracking, and read state synchronization
  - name: Users
    description: User profile management, username availability checks, and profile feeds
  - name: Media Storage
    description: Centralized image and media storage powered by Cloudinary with automatic optimization (f_auto, q_auto) and responsive variants
  - name: Admin
    description: Administrative APIs and content management

paths:
  # ==========================================
  # SYSTEM & HEALTH
  # ==========================================
  /health:
    get:
      summary: Health check and service readiness status
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '503':
          description: Service is degraded or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/ready:
    get:
      summary: Readiness probe for orchestrators and container health
      operationId: getReadiness
      tags:
        - Health
      responses:
        '200':
          description: Service is ready and database connection is active
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  uptime:
                    type: integer
                    example: 3600
        '503':
          description: Database disconnected or service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/live:
    get:
      summary: Liveness probe for orchestrators and load balancers
      operationId: getLiveness
      tags:
        - Health
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'


  # ==========================================
  # WEATHER (PUBLIC / GUEST FRIENDLY)
  # ==========================================
  /weather:
    get:
      summary: Get live weather data for Lombok or specific location/region
      description: |
        Returns live temperature, condition, humidity, wind, UV index, and weather icon.
        Supports filtering by LombokRegion enum, GPS coordinates (lat/lng), or location name query.
      operationId: getWeather
      tags:
        - Weather
      parameters:
        - name: region
          in: query
          description: Lombok region
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: lat
          in: query
          description: Latitude coordinate
          required: false
          schema:
            type: number
            example: -8.892
        - name: lng
          in: query
          description: Longitude coordinate
          required: false
          schema:
            type: number
            example: 116.295
        - name: location
          in: query
          description: Specific location name (e.g. Senggigi, Kuta, Sembalun)
          required: false
          schema:
            type: string
            example: Senggigi
        - name: q
          in: query
          description: Free-text search query for location
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Current weather retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /weather/current:
    get:
      summary: Alias for GET /weather (Get current weather data)
      description: Explicit current weather endpoint alias.
      operationId: getCurrentWeather
      tags:
        - Weather
      parameters:
        - name: region
          in: query
          description: Lombok region
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: lat
          in: query
          description: Latitude coordinate
          required: false
          schema:
            type: number
            example: -8.892
        - name: lng
          in: query
          description: Longitude coordinate
          required: false
          schema:
            type: number
            example: 116.295
        - name: location
          in: query
          description: Specific location name
          required: false
          schema:
            type: string
            example: Senggigi
        - name: q
          in: query
          description: Free-text search query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Current weather retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # ==========================================
  # AUTHENTICATION & USERS
  # ==========================================
  /auth/register:
    post:
      summary: Register a new user traveler account
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Email address is already in use"
                errorCode: "EMAIL_ALREADY_EXISTS"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      summary: Authenticate user and obtain JWT tokens
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid email or password"
                errorCode: "INVALID_CREDENTIALS"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      summary: Authenticate user with verified Google ID Token (Google Sign-In)
      description: |
        Authenticates user with a cryptographically verified Google ID Token.
        - If Google identity is already linked -> logs in directly.
        - If Google identity is not yet linked but email matches existing account -> links Google account to existing user and logs in.
        - If user does not exist -> returns REGISTRATION_REQUIRED with short-lived registrationToken.
      operationId: googleLogin
      tags:
        - Google Authentication
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Login or registration required response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Invalid or expired Google ID Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Google token verification failed: Invalid signature or expired token"
                errorCode: "INVALID_GOOGLE_TOKEN"
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google/register:
    post:
      summary: Complete user registration with Google account and set password
      description: |
        Completes registration for a new user using a signed `registrationToken` received from `POST /auth/google`.
        Creates User record, sets initial password hash, links Google `AuthIdentity`, and returns active JWT session.
      operationId: completeGoogleRegistration
      tags:
        - Google Authentication
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteGoogleRegistrationRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteGoogleRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Invalid or expired registration token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Registration token has expired. Please sign in with Google again."
                errorCode: "REGISTRATION_TOKEN_EXPIRED"
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google/link:
    post:
      summary: Link Google account to currently authenticated user
      description: Verifies Google ID Token and links Google identity to authenticated user.
      operationId: linkGoogleAccount
      tags:
        - Account Linking
        - Google Authentication
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Google account linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Google account already linked to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Google account is already linked to another user"
                errorCode: "GOOGLE_ACCOUNT_ALREADY_LINKED"
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Unlink Google account from currently authenticated user
      description: Removes linked Google identity from user account if password or another auth method exists.
      operationId: unlinkGoogleAccount
      tags:
        - Account Linking
        - Google Authentication
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Google account unlinked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponse'
        '400':
          description: Cannot unlink the only authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Cannot unlink the only authentication method"
                errorCode: "ONLY_AUTH_METHOD"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/providers:
    get:
      summary: Get active authentication methods/providers for current user
      description: Returns boolean indicators for password and Google sign-in support on the account.
      operationId: getAuthProviders
      tags:
        - Account Linking
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active auth providers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh-token:
    post:
      summary: Refresh expired access token using refresh token
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Logout user and invalidate session
      operationId: logoutUser
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # USERS & PROFILES
  # ==========================================
  /users/username/check:
    get:
      summary: Check if a username is available or taken
      description: Validates username format, length, reserved words, and uniqueness in real-time.
      operationId: checkUsernameAvailability
      tags:
        - Users
      parameters:
        - name: username
          in: query
          required: true
          description: Username to check (3-30 characters, lowercase alphanumeric and underscore)
          schema:
            type: string
            example: wahyu_pratama
      responses:
        '200':
          description: Username availability status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      summary: Get current authenticated user profile
      description: Returns full user profile including username, email, travel style, preferences, and metadata.
      operationId: getCurrentUserProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update current authenticated user profile
      description: Updates username, name, avatarUrl, phone, bio, travel style, and preferences.
      operationId: updateCurrentUserProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Username is already taken"
                errorCode: "USERNAME_ALREADY_EXISTS"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/posts:
    get:
      summary: Get feed posts created by a specific user (Public Profile Feed)
      description: Retrieves timeline of posts published by the specified user with cursor pagination.
      operationId: getUserFeedPosts
      tags:
        - Users
        - Feeds & Community
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
            example: usr_traveler_demo_01
        - name: cursor
          in: query
          required: false
          description: Next page cursor token
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Number of items per page (default 20, max 50)
          schema:
            type: integer
            default: 20
        - name: order
          in: query
          required: false
          description: Sorting order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: User feed posts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPostListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # DESTINATIONS
  # ==========================================
  /destinations:
    get:
      summary: Get list of destinations with filtering and pagination
      operationId: getDestinations
      tags:
        - Destinations
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: Filter by category slug (e.g. beach, waterfall, mountain, culture, gili)
          required: false
          schema:
            type: string
        - name: region
          in: query
          description: Filter by region in Lombok
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: sort_by
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [popular, rating, name, price_asc, price_desc]
            default: popular
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Successful response with caching and pagination metadata
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=60, stale-while-revalidate=30"
              description: HTTP caching policy (public for guest users, private for authenticated users)
            Vary:
              schema:
                type: string
                example: "Authorization, Accept-Encoding"
              description: Informs HTTP caches that response content varies by Authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/{id}/favorite:
    post:
      summary: Toggle destination favorite status for current user
      description: |
        Toggles favorite state on the destination.
        - If the destination is not yet favorited: Adds to favorites and returns isFavorite: true.
        - If the destination is already favorited: Removes from favorites and returns isFavorite: false.
      operationId: toggleDestinationFavorite
      tags:
        - Destinations
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier or slug of the destination
          schema:
            type: string
            example: "dest_tanjung_aan"
      responses:
        '200':
          description: Favorite status toggled successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Destination added to favorites successfully"
                  data:
                    type: object
                    required:
                      - destinationId
                      - destinationName
                      - isFavorite
                    properties:
                      destinationId:
                        type: string
                        example: "dest_tanjung_aan"
                      destinationName:
                        type: string
                        example: "Pantai Tanjung Aan"
                      isFavorite:
                        type: boolean
                        example: true
                      destination:
                        $ref: '#/components/schemas/DestinationDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get favorite status of destination for current user
      operationId: getDestinationFavoriteStatus
      tags:
        - Destinations
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier or slug of the destination
          schema:
            type: string
            example: "dest_tanjung_aan"
      responses:
        '200':
          description: Favorite status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Success fetching favorite status"
                  data:
                    type: object
                    required:
                      - destinationId
                      - destinationName
                      - isFavorite
                    properties:
                      destinationId:
                        type: string
                        example: "dest_tanjung_aan"
                      destinationName:
                        type: string
                        example: "Pantai Tanjung Aan"
                      isFavorite:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Explicitly remove destination from user favorites
      operationId: removeDestinationFavoriteById
      tags:
        - Destinations
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier or slug of the destination
          schema:
            type: string
            example: "dest_tanjung_aan"
      responses:
        '200':
          description: Destination removed from favorites successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/{id}:
    get:
      summary: Get destination detail by ID
      operationId: getDestinationById
      tags:
        - Destinations
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the destination
          schema:
            type: string
            example: "dest_tanjung_aan"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/featured:
    get:
      summary: Get featured & trending destinations for hero banner and highlights
      operationId: getFeaturedDestinations
      tags:
        - Destinations
      parameters:
        - name: limit
          in: query
          description: Maximum number of featured destinations
          required: false
          schema:
            type: integer
            default: 5
            maximum: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/nearby:
    get:
