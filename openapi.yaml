  # ==========================================
  # IN-APP NOTIFICATIONS & READ STATES
  # ==========================================
  /notifications:
    get:
      summary: Get user notifications (Paginated, Unread Filter)
      description: |
        Mengambil daftar notifikasi in-app untuk pengguna yang sedang login, terurut dari yang paling baru.
        Mendukung filter `unreadOnly=true` serta paginasi (`page` & `limit`).
      operationId: getUserNotifications
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Halaman data (dimulai dari 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Jumlah notifikasi per halaman (maksimum 50)
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: unreadOnly
          in: query
          description: Filter hanya notifikasi yang belum dibaca (`true`/`false`)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/unread-count:
    get:
      summary: Get unread notifications count
      description: |
        Mengambil jumlah total notifikasi yang belum dibaca oleh pengguna login untuk badge counter pada aplikasi mobile / frontend.
      operationId: getUnreadNotificationCount
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{id}/read:
    patch:
      summary: Mark single notification as read
      description: |
        Menandai sebuah notifikasi spesifik milik pengguna sebagai telah dibaca (`isRead: true`).
      operationId: markNotificationAsRead
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID notifikasi
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Notification marked as read
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "c4b12345-6789-abcd-ef01-23456789abcd"
                      isRead:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/read-all:
    patch:
      summary: Mark all unread notifications as read
      description: |
        Menandai seluruh notifikasi milik pengguna yang belum dibaca menjadi telah dibaca sekaligus.
      operationId: markAllNotificationsAsRead
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All notifications marked as read successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: All notifications marked as read successfully
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==========================================
  # CENTRALIZED MEDIA STORAGE & CLOUDINARY
  # ==========================================
  /media/images:
    post:
      tags:
        - Media Storage
      summary: Upload Single Image
      description: |
        Uploads a single image to Cloudinary centralized media storage with automatic optimization (f_auto, q_auto)
        and generates responsive variants (thumbnail, card, cover).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary image file (JPEG, PNG, WEBP, GIF, SVG, max 5MB)
                type:
                  type: string
                  enum: [DESTINATION, ITINERARY, ACTIVITY, PROFILE, CATEGORY, FEED, GENERAL]
                  default: GENERAL
                  description: Target entity classification for folder structure
                entityId:
                  type: string
                  description: Optional ID of the associated entity
                folder:
                  type: string
                  description: Optional custom subfolder path
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Image uploaded successfully
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://res.cloudinary.com/tzccdgab/image/upload/f_auto,q_auto/lombok-explorer/destinations/merese.webp
                      secureUrl:
                        type: string
                        example: https://res.cloudinary.com/tzccdgab/image/upload/f_auto,q_auto/lombok-explorer/destinations/merese.webp
                      publicId:
                        type: string
                        example: lombok-explorer/destinations/merese
                      filename:
                        type: string
                        example: merese.webp
                      originalName:
                        type: string
                        example: merese_sunset.jpg
                      mimeType:
                        type: string
                        example: image/jpeg
                      size:
                        type: integer
                        example: 245890
                      width:
                        type: integer
                        example: 1920
                      height:
                        type: integer
                        example: 1080
                      format:
                        type: string
                        example: webp
                      provider:
                        type: string
                        example: Cloudinary
                      variants:
                        type: object
                        properties:
                          thumbnail:
                            type: string
                            example: https://res.cloudinary.com/tzccdgab/image/upload/w_200,h_200,c_fill,f_auto,q_auto/lombok-explorer/destinations/merese.webp
                          card:
                            type: string
                            example: https://res.cloudinary.com/tzccdgab/image/upload/w_600,h_400,c_fill,f_auto,q_auto/lombok-explorer/destinations/merese.webp
                          cover:
                            type: string
                            example: https://res.cloudinary.com/tzccdgab/image/upload/w_1200,h_675,c_fill,f_auto,q_auto/lombok-explorer/destinations/merese.webp
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Media Storage
      summary: Delete Stored Media
      description: Deletes an asset from Cloudinary storage by its publicId or URL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicId:
                  type: string
                  example: lombok-explorer/destinations/merese
                fileUrl:
                  type: string
                  example: https://res.cloudinary.com/tzccdgab/image/upload/lombok-explorer/destinations/merese.webp
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponse'

  /media/images/multiple:
    post:
      tags:
        - Media Storage
      summary: Upload Multiple Images
      description: Uploads up to 10 images concurrently to Cloudinary.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                type:
                  type: string
                  enum: [DESTINATION, ITINERARY, ACTIVITY, PROFILE, CATEGORY, FEED, GENERAL]
      responses:
        '201':
          description: Images uploaded successfully

  /users/me/avatar:
    post:
      tags:
        - Users
      summary: Upload Current User Avatar
      description: Uploads new profile avatar to Cloudinary, updates user record, and cleans up previous avatar asset.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded successfully

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token for authorized requests

  responses:
    BadRequestError:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Invalid query parameters"
            errorCode: "BAD_REQUEST"
    UnauthorizedError:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Unauthorized access, please login"
            errorCode: "UNAUTHORIZED"
    ForbiddenError:
      description: Forbidden - Insufficient permissions or role requirement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "You do not have permission to access this resource"
            errorCode: "FORBIDDEN"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Destination not found"
            errorCode: "NOT_FOUND"
    ConflictError:
      description: Conflict with existing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Resource already exists"
            errorCode: "CONFLICT"
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Too many requests, please try again later"
            errorCode: "RATE_LIMIT_EXCEEDED"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Internal server error occurred"
            errorCode: "INTERNAL_SERVER_ERROR"
    ActionSuccessResponse:
      description: Action completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionSuccessResponse'
          example:
            success: true
            message: "Action completed successfully"

  schemas:
    # --- COMMON / META SCHEMAS ---
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - currentPage
        - totalCount
        - hasNextPage
        - hasPrevPage
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 28
        totalPages:
          type: integer
          example: 3
        currentPage:
          type: integer
          description: Current page number (alias of page for Android pagination)
          example: 1
        totalCount:
          type: integer
          description: Total number of items (alias of total for Android pagination)
          example: 28
        hasNextPage:
          type: boolean
          description: Indicates whether there is another page available (useful for infinite scroll)
          example: true
        hasPrevPage:
          type: boolean
          description: Indicates whether there is a preceding page
          example: false

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Resource not found"
        errorCode:
          type: string
          example: "DESTINATION_NOT_FOUND"
        details:
          type: array
          items:
            type: string
          nullable: true

    ForbiddenError:
      type: object
      required:
        - success
        - message
        - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "You do not have permission to access this resource"
        errorCode:
          type: string
          example: "FORBIDDEN"
        details:
          type: array
          items:
            type: string
          nullable: true

    ActionSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Action completed successfully"

    StandardActionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    # --- ENUMS ---
    LombokRegion:
      type: string
      enum:
        - LOMBOK_SELATAN   # Kuta, Mandalika, Tanjung Aan, Merese, Mawun, Selong Belanak
        - LOMBOK_UTARA     # Senaru, Rinjani, Tiu Kelep, Bayan, Gili Islands
        - LOMBOK_BARAT     # Senggigi, Malimbu, Sekotong, Batu Layar
        - LOMBOK_TIMUR     # Sembalun, Pink Beach, Tetebatu
        - LOMBOK_TENGAH    # Sade, Sukarara, Praya
        - GILI_ISLANDS     # Trawangan, Meno, Air
      example: "LOMBOK_SELATAN"

    DifficultyLevel:
      type: string
      enum:
        - EASY
        - MODERATE
        - CHALLENGING
        - EXTREME
      example: "EASY"

    TravelStyle:
      type: string
      enum:
        - NATURE_ADVENTURE
        - BEACH_RELAXATION
        - CULTURE_HERITAGE
        - CULINARY_EXPLORER
        - PHOTOGRAPHY_SPOTS
        - FAMILY_FRIENDLY
      example: "BEACH_RELAXATION"

    BudgetLevel:
