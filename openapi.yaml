        username:
          type: string
          nullable: true
          example: "wahyutraveler"
        displayName:
          type: string
          example: "Wahyu Saputra"
        avatarUrl:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/tzccdgab/image/upload/v1/avatar.webp"

    NotificationDto:
      type: object
      required:
        - id
        - type
        - title
        - body
        - actor
        - isRead
        - createdAt
      properties:
        id:
          type: string
          example: "notif_123e4567-e89b-12d3-a456-426614174000"
        type:
          type: string
          enum: [POST_LIKED, POST_COMMENTED, COMMENT_REPLIED, MENTIONED]
          example: POST_LIKED
        title:
          type: string
          example: "Wahyu Saputra menyukai postingan Anda"
        body:
          type: string
          example: "Ketuk untuk melihat postingan Anda"
        actor:
          $ref: '#/components/schemas/NotificationActorDto'
        postId:
          type: string
          nullable: true
          example: "773efbdc-6bf1-4dd7-9c0f-d9c92a303988"
        commentId:
          type: string
          nullable: true
          example: "c73efbdc-6bf1-4dd7-9c0f-d9c92a303988"
        isRead:
          type: boolean
          example: false
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-09-05T12:00:00.000Z"

    NotificationListResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Notifications retrieved successfully
        data:
          type: object
          required:
            - items
            - pagination
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDto'
            pagination:
              type: object
              required:
                - page
                - limit
                - totalItems
                - totalPages
                - hasNext
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 20
                totalItems:
                  type: integer
                  example: 1
                totalPages:
                  type: integer
                  example: 1
                hasNext:
                  type: boolean
                  example: false

