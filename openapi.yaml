openapi: 3.0.3
info:
  title: Lombok Explorer API
  description: |
    API Contract untuk Lombok Explorer — Platform eksplorasi wisata, rekomendasi cerdas, 
    dan perencanaan perjalanan (itinerary planner) pulau Lombok, Nusa Tenggara Barat.
  version: 1.0.0
  contact:
    name: Lombok Explorer Team
    email: support@lombokexplorer.com

servers:
  - url: https://api.lombokexplorer.com/api/v1
    description: Production Server (v1)
  - url: http://localhost:8080/api/v1
    description: Local Development Server (v1)
  - url: http://localhost:8080/v1
    description: Legacy Compatibility Alias Server

paths:
  # ==========================================
  # SYSTEM & HEALTH
  # ==========================================
  /health:
    get:
      summary: Health check and service readiness status
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '503':
          description: Service is degraded or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/ready:
    get:
      summary: Readiness probe for orchestrators and container health
      operationId: getReadiness
      tags:
        - Health
      responses:
        '200':
          description: Service is ready and database connection is active
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
                  uptime:
                    type: integer
                    example: 3600
        '503':
          description: Database disconnected or service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/live:
    get:
      summary: Liveness probe for orchestrators and load balancers
      operationId: getLiveness
      tags:
        - Health
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'


  # ==========================================
  # AUTHENTICATION & USERS
  # ==========================================
  /auth/register:
    post:
      summary: Register a new user traveler account
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Email address is already in use"
                errorCode: "EMAIL_ALREADY_EXISTS"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      summary: Authenticate user and obtain JWT tokens
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Invalid email or password"
                errorCode: "INVALID_CREDENTIALS"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    post:
      summary: Authenticate user with verified Google ID Token (Google Sign-In)
      description: |
        Authenticates user with a cryptographically verified Google ID Token.
        - If Google identity is already linked -> logs in directly.
        - If Google identity is not yet linked but email matches existing account -> links Google account to existing user and logs in.
        - If user does not exist -> creates new user and links Google identity.
      operationId: googleLogin
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Invalid or expired Google ID Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Google token verification failed: Invalid signature or expired token"
                errorCode: "INVALID_GOOGLE_TOKEN"
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh-token:
    post:
      summary: Refresh expired access token using refresh token
      operationId: refreshToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Logout user and invalidate session
      operationId: logoutUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/profile:
    put:
      summary: Update profile for current authenticated user
      operationId: updateUserProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # DESTINATIONS
  # ==========================================
  /destinations:
    get:
      summary: Get list of destinations with filtering and pagination
      operationId: getDestinations
      tags:
        - Destinations
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: Filter by category slug (e.g. beach, waterfall, mountain, culture, gili)
          required: false
          schema:
            type: string
        - name: region
          in: query
          description: Filter by region in Lombok
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: sort_by
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [popular, rating, name, price_asc, price_desc]
            default: popular
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/{id}:
    get:
      summary: Get destination detail by ID
      operationId: getDestinationById
      tags:
        - Destinations
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the destination
          schema:
            type: string
            example: "dest_tanjung_aan"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/featured:
    get:
      summary: Get featured & trending destinations for hero banner and highlights
      operationId: getFeaturedDestinations
      tags:
        - Destinations
      parameters:
        - name: limit
          in: query
          description: Maximum number of featured destinations
          required: false
          schema:
            type: integer
            default: 5
            maximum: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /destinations/nearby:
    get:
      summary: Get destinations near specific coordinates
      operationId: getNearbyDestinations
      tags:
        - Destinations
      parameters:
        - name: latitude
          in: query
          required: true
          description: Current latitude
          schema:
            type: number
            format: double
            example: -8.8925
        - name: longitude
          in: query
          required: true
          description: Current longitude
          schema:
            type: number
            format: double
            example: 116.3150
        - name: radius_km
          in: query
          required: false
          description: Radius in kilometers
          schema:
            type: number
            default: 25.0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyDestinationListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # CATEGORIES
  # ==========================================
  /categories:
    get:
      summary: Get list of all travel categories
      operationId: getCategories
      tags:
        - Categories
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # SEARCH
  # ==========================================
  /destinations/search:
    get:
      summary: Search destinations by keyword and multifaceted filters
      operationId: searchDestinations
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search keyword query
          schema:
            type: string
            example: "mandalika"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: min_rating
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 1.0
            maximum: 5.0
            example: 4.5
        - name: max_price
          in: query
          required: false
          description: Maximum entrance fee in IDR
          schema:
            type: number
            example: 50000
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # RECOMMENDATIONS
  # ==========================================
  /recommendations:
    get:
      summary: Get curated recommendations based on user travel persona and preferences
      operationId: getRecommendations
      tags:
        - Recommendations
      parameters:
        - name: travel_style
          in: query
          description: Primary travel preference style
          required: false
          schema:
            $ref: '#/components/schemas/TravelStyle'
        - name: duration_days
          in: query
          description: Planned trip length in days
          required: false
          schema:
            type: integer
            default: 3
        - name: budget_level
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BudgetLevel'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ITINERARY
  # ==========================================
  /itineraries/generate:
    post:
      summary: Generate smart auto-itinerary based on days, preferences, and pace
      operationId: generateItinerary
      tags:
        - Itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateItineraryRequest'
      responses:
        '200':
          description: Generated itinerary plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /itineraries:
    get:
      summary: Get user saved/created itineraries
      operationId: getItineraries
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user itineraries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a custom itinerary
      operationId: createItinerary
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItineraryRequest'
      responses:
        '201':
          description: Itinerary created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /itineraries/{id}:
    get:
      summary: Get itinerary detail by ID
      operationId: getItineraryById
      tags:
        - Itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Itinerary details with days and activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update existing itinerary
      operationId: updateItinerary
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          description: Itinerary updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete an itinerary
      operationId: deleteItinerary
      tags:
        - Itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Itinerary deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /itineraries/{id}/stops:
    post:
      summary: Add a destination stop into trip itinerary
      operationId: addTripStop
      tags:
        - Itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destinationId
                - dayNumber
              properties:
                destinationId:
                  type: string
                  example: "dest_desa_sade"
                dayNumber:
                  type: integer
                  default: 1
                activityNotes:
                  type: string
                  example: "Belajar menenun songket Sasak"
      responses:
        '200':
          description: Stop added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /itineraries/{id}/stops/reorder:
    put:
      summary: Reorder trip stops within a specific day (Drag and drop reordering)
      operationId: reorderTripStops
      tags:
        - Itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dayNumber
                - fromIndex
                - toIndex
              properties:
                dayNumber:
                  type: integer
                  example: 1
                fromIndex:
                  type: integer
                  example: 0
                toIndex:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Stops reordered and itinerary recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /itineraries/{id}/optimize:
    post:
      summary: Smart route and timing optimization for a day itinerary
      operationId: optimizeItineraryRoute
      tags:
        - Itinerary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dayNumber
              properties:
                dayNumber:
                  type: integer
                  example: 1
                startFromAirport:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Optimized itinerary route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryDetailResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # FAVORITES
  # ==========================================
  /favorites:
    get:
      summary: Get all saved favorite destinations for the current user
      operationId: getFavorites
      tags:
        - Favorites
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of favorite destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /favorites/{destinationId}:
    post:
      summary: Add destination to favorites
      operationId: addFavorite
      tags:
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Destination added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove destination from favorites
      operationId: removeFavorite
      tags:
        - Favorites
      security:
        - BearerAuth: []
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Destination removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # WEATHER
  # ==========================================
  /weather:
    get:
      summary: Get current weather and 5-day forecast for Lombok regions
      operationId: getWeather
      tags:
        - Weather
      parameters:
        - name: region
          in: query
          required: false
          description: Lombok region or city
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Weather information and forecast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # RESTAURANTS
  # ==========================================
  /restaurants:
    get:
      summary: Get local culinary spots & restaurants in Lombok
      operationId: getRestaurants
      tags:
        - Culinary
      parameters:
        - name: region
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: cuisine
          in: query
          description: Cuisine type (e.g. sasak, seafood, vegetarian, western, cafe)
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of culinary places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # ACCOMMODATIONS
  # ==========================================
  /accommodations:
    get:
      summary: Get curated hotels, resorts, and villas in Lombok
      operationId: getAccommodations
      tags:
        - Accommodations
      parameters:
        - name: region
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LombokRegion'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [resort, villa, hotel, homestay, glamping]
        - name: min_price
          in: query
          required: false
          schema:
            type: number
        - name: max_price
          in: query
          required: false
          schema:
            type: number
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of accommodations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccommodationListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # REVIEWS
  # ==========================================
  /destinations/{id}/reviews:
    get:
      summary: Get reviews for a specific destination
      operationId: getDestinationReviews
      tags:
        - Reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [recent, highest_rating, lowest_rating]
            default: recent
      responses:
        '200':
          description: Destination reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Submit a new review for a destination
      operationId: submitDestinationReview
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reviews/{id}:
    put:
      summary: Update an existing review
      description: Update review rating, content, or photos. User can only edit their own reviews.
      operationId: updateReview
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Review unique identifier (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a review
      description: Soft delete a review. User can only delete their own reviews (or Admin).
      operationId: deleteReview
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Review unique identifier (UUID)
      responses:
        '200':
          description: Review deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

