components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter standard JWT Bearer token obtained from `/auth/login`

  schemas:
    AdminAuditLogItem:
      type: object
      properties:
        id:
          type: string
          example: "log_123e4567-e89b-12d3-a456-426614174000"
        userId:
          type: string
          nullable: true
          example: "usr_admin_01"
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            role:
              type: string
            avatarUrl:
              type: string
              nullable: true
        action:
          type: string
          example: "DESTINATION_CREATED"
        resource:
          type: string
          example: "Destination"
        resourceId:
          type: string
          nullable: true
          example: "dst_merese_hill"
        entity:
          type: string
          example: "Destination"
        entityId:
          type: string
          nullable: true
          example: "dst_merese_hill"
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        details:
          type: object
          nullable: true
        ipAddress:
          type: string
          nullable: true
          example: "127.0.0.1"
        userAgent:
          type: string
          nullable: true
          example: "Mozilla/5.0"
        createdAt:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time

    AdminAuditLogListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Audit logs retrieved successfully"
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLogItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AdminAuditLogDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Audit log details retrieved successfully"
        data:
          $ref: '#/components/schemas/AdminAuditLogItem'

    BulkDeleteDestinationsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          example: ["dst_merese_hill", "dst_kuta_beach"]
        hard:
          type: boolean
          default: false
          example: false

    BulkDeleteDestinationsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Successfully deleted 2 destination(s)"
        data:
          type: object
          properties:
            affectedCount:
              type: integer
              example: 2
            hard:
              type: boolean
              example: false

    BulkUpdateDestinationStatusRequest:
      type: object
      required:
        - ids
        - status
      properties:
        ids:
          type: array
          items:
            type: string
          example: ["dst_merese_hill", "dst_kuta_beach"]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: PUBLISHED

    BulkUpdateDestinationStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Successfully updated status of 2 destination(s) to PUBLISHED"
        data:
          type: object
          properties:
            affectedCount:
              type: integer
              example: 2
            status:
              type: string
              enum: [DRAFT, PUBLISHED, ARCHIVED]
              example: PUBLISHED

    UpdateContentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: PUBLISHED

    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@lombokexplorer.com
        password:
          type: string
          format: password
          example: Password123!

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AdminUserDto:
      type: object
      properties:
        id:
          type: string
          example: "usr_traveler_demo_01"
        email:
          type: string
          format: email
          example: "traveler@lombokexplorer.com"
        name:
          type: string
          example: "Rizky Pratama"
        avatarUrl:
          type: string
          nullable: true
          example: "https://images.unsplash.com/photo-1534528741775-53994a69daeb"
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        role:
          type: string
          enum: [USER, ADMIN]
          example: "ADMIN"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE]
          example: "ACTIVE"
        travelStyle:
          type: string
          nullable: true
          enum: [NATURE_ADVENTURE, BEACH_RELAXATION, CULTURE_HERITAGE, CULINARY_EXPLORER, PHOTOGRAPHY_SPOTS, FAMILY_FRIENDLY]
          example: "BEACH_RELAXATION"
        preferredRegion:
          type: string
          nullable: true
          enum: [LOMBOK_SELATAN, LOMBOK_UTARA, LOMBOK_BARAT, LOMBOK_TIMUR, LOMBOK_TENGAH, GILI_ISLANDS]
          example: "LOMBOK_SELATAN"
        isEmailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        stats:
          type: object
          properties:
