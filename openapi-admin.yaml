components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter standard JWT Bearer token obtained from `/auth/login`
  responses:
    ForbiddenError:
      description: Forbidden - Admin role and active account status required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Admin access required"
            errorCode: "ADMIN_ACCESS_REQUIRED"
    ActionSuccessResponse:
      description: Action performed successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActionSuccessResponse"
          example:
            success: true
            message: "Action completed successfully"
  schemas:
    ForbiddenError:
      type: object
      required:
        - success
        - message
        - errorCode
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Admin access required"
        errorCode:
          type: string
          example: "ADMIN_ACCESS_REQUIRED"
        details:
          type: array
          items:
            type: string
          nullable: true
    ActionSuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Action completed successfully"
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - currentPage
        - totalCount
        - hasNextPage
        - hasPrevPage
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        currentPage:
          type: integer
          description: Current page number (alias of page for Android client pagination)
          example: 1
        totalCount:
          type: integer
          description: Total number of items (alias of total for Android client pagination)
          example: 42
        hasNextPage:
          type: boolean
          description: Indicates whether there is another page available
          example: true
        hasPrevPage:
          type: boolean
          description: Indicates whether there is a preceding page
          example: false
    UploadResourceType:
      type: string
      enum:
        - DESTINATION
        - DESTINATION_IMAGE
        - CATEGORY
        - RESTAURANT
        - ACCOMMODATION
        - ITINERARY_TEMPLATE
        - USER_AVATAR
        - REVIEW
        - FEED
      example: DESTINATION
    AdminUploadSignatureRequest:
      type: object
      required:
        - resourceType
      properties:
        resourceType:
          $ref: "#/components/schemas/UploadResourceType"
        resourceId:
          type: string
          nullable: true
          description: Optional existing entity ID for update workflows
          example: dest_123e4567-e89b-12d3-a456-426614174000
    AdminUploadSignatureData:
      type: object
      required:
        - signature
        - timestamp
        - apiKey
        - cloudName
        - folder
        - uploadUrl
        - allowedFormats
        - maxFileSize
        - resourceType
        - uploadSessionId
      properties:
        signature:
          type: string
          description: SHA-1 / SHA-256 cryptographic signature
          example: 1a2b3c4d5e6f7g8h9i0j
        timestamp:
          type: integer
          description: Unix timestamp in seconds
          example: 1718000000
        apiKey:
          type: string
          description: Cloudinary public API key
          example: "123456789012345"
        cloudName:
          type: string
          description: Cloudinary cloud name
          example: lombok-explorer
        folder:
          type: string
          description: Target Cloudinary folder
          example: lombok-explorer/admin/usr_admin_01/destinations/sess_abc123
        uploadUrl:
          type: string
          description: Direct upload endpoint URL to Cloudinary CDN
          example: https://api.cloudinary.com/v1_1/lombok-explorer/image/upload
        allowedFormats:
          type: array
          items:
            type: string
          example: ["jpg", "jpeg", "png", "webp"]
        maxFileSize:
          type: integer
          description: Maximum allowed file size in bytes
          example: 10485760
        resourceType:
          $ref: "#/components/schemas/UploadResourceType"
        uploadSessionId:
          type: string
          description: Unique upload session ID
          example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
    AdminUploadSignatureResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Upload signature generated successfully
        data:
          $ref: "#/components/schemas/AdminUploadSignatureData"
    CloudinaryAssetDto:
      type: object
      required:
        - publicId
        - secureUrl
      properties:
        publicId:
          type: string
          description: Cloudinary public ID
          example: lombok-explorer/admin/usr_admin_01/destinations/sess_123/img_01
        secureUrl:
          type: string
          description: HTTPS delivery URL
          example: https://res.cloudinary.com/lombok-explorer/image/upload/v1/admin/destinations/img_01.jpg
        width:
          type: integer
          nullable: true
          example: 1920
        height:
          type: integer
          nullable: true
          example: 1080
        format:
          type: string
          nullable: true
          example: webp
        bytes:
          type: integer
          nullable: true
          example: 245100
        originalFilename:
          type: string
          nullable: true
          example: pantai-merese.jpg
    CloudinaryAssetInput:
      description: Cloudinary uploaded asset object or legacy URL string
      oneOf:
        - $ref: "#/components/schemas/CloudinaryAssetDto"
        - type: string
          description: Fallback legacy direct URL string
          example: https://res.cloudinary.com/demo/image/upload/v1/sample.jpg
    AdminAuditLogDto:
      $ref: "#/components/schemas/AdminAuditLogItem"
    AdminAuditLogItem:
      type: object
      properties:
        id:
          type: string
          example: log_123e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          nullable: true
          example: usr_admin_01
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            role:
              type: string
            avatarUrl:
              type: string
              nullable: true
        action:
          type: string
          example: DESTINATION_CREATED
        resource:
          type: string
          example: Destination
        resourceId:
          type: string
          nullable: true
          example: dst_merese_hill
        entity:
          type: string
          example: Destination
        entityId:
          type: string
          nullable: true
          example: dst_merese_hill
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        details:
          type: object
          nullable: true
        ipAddress:
          type: string
          nullable: true
          example: 127.0.0.1
        userAgent:
          type: string
          nullable: true
