openapi: 3.0.3
info:
  title: Lombok Explorer Admin API
  description: |
    # Lombok Explorer — Dedicated Admin API Specification
    Comprehensive RESTful Administrative Operations API for the Lombok Explorer Admin Dashboard and Management Portal.
    
    All endpoints in this specification require administrator privileges (`role: ADMIN`). Public users and standard travelers are strictly restricted from accessing these endpoints (`403 Forbidden`).
  version: 1.0.0
  contact:
    name: Lombok Explorer Engineering Team
    email: wahyush04@gmail.com
    url: https://lombokexplorer.com

servers:
  - url: /api/v1/admin
    description: Primary Canonical Admin API v1
  - url: /v1/admin
    description: Backward Compatibility Admin API Alias

tags:
  - name: Admin Auth
    description: Administrator authentication, token refresh, and session management
  - name: Dashboard
    description: Administrative KPI metrics and analytical overview (Phase 3+)
  - name: Destinations
    description: Full destination lifecycle management (Phase 4+)
  - name: Categories
    description: Master tourism categories management (Phase 5+)
  - name: Reviews & Moderation
    description: Review moderation and user feedback oversight (Phase 9+)
  - name: User Management
    description: User directory, role assignment, and account status (Phase 12+)
  - name: Audit Logs
    description: System and administrative operation trail logs (Phase 16+)

security:
  - BearerAuth: []

paths:
  # ==========================================
  # ADMIN AUTHENTICATION
  # ==========================================
  /auth/login:
    post:
      summary: Administrator Login
      description: |
        Authenticates an administrative user. Requires a valid registered account with `role: ADMIN` and an active (non-deactivated) status.
        Returns a short-lived access token and a rotating refresh token.
      operationId: adminLogin
      tags:
        - Admin Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Administrator login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password, or deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account exists but lacks ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh Admin Access Token
      description: |
        Generates a new access token and rotating refresh token using a valid admin refresh token.
      operationId: adminRefreshToken
      tags:
        - Admin Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Refreshed account is not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Administrator Logout
      description: Revokes the active admin refresh token session in the database.
      operationId: adminLogout
      tags:
        - Admin Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Administrator logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-admin token rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Get Current Admin Profile
      description: Returns the authenticated administrator user profile details.
      operationId: getAdminMe
      tags:
        - Admin Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-admin token rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # ADMIN DASHBOARD & ANALYTICS
  # ==========================================
  /dashboard:
    get:
      summary: Get Admin Dashboard Statistics & Analytics
      description: |
        Aggregates key platform operational metrics including total entities, pending reviews count, new user/review growth rates, and top popular/favorited destinations.
      operationId: getAdminDashboard
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Optional start date filter (ISO string or YYYY-MM-DD)
          schema:
            type: string
            example: "2026-01-01"
        - name: endDate
          in: query
          description: Optional end date filter (ISO string or YYYY-MM-DD)
          schema:
            type: string
            example: "2026-12-31"
      responses:
        '200':
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-admin token rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # ADMIN DESTINATIONS MANAGEMENT
  # ==========================================
  /destinations:
    get:
      summary: List and Filter Destinations (Admin)
      description: Returns a paginated list of destinations with support for search, category, region, difficulty, rating, price, and status filters.
      operationId: getAdminDestinations
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
            enum: [LOMBOK_SELATAN, LOMBOK_UTARA, LOMBOK_BARAT, LOMBOK_TIMUR, LOMBOK_TENGAH, GILI_ISLANDS]
        - name: status
          in: query
          schema:
            type: string
            enum: [PUBLISHED, DRAFT, ARCHIVED]
        - name: isFeatured
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, rating, reviewCount, entranceFee, ticketPrice, createdAt, updatedAt]
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Destinations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDestinationListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a New Destination
      description: Creates a new tourism destination record. Generates unique slug automatically if omitted.
      operationId: createAdminDestination
      tags:
        - Destinations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationRequest'
      responses:
        '201':
          description: Destination created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDestinationDetailResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /destinations/{id}:
    get:
      summary: Get Destination by ID or Slug
      description: Returns complete destination details including reviews count and favorite statistics.
      operationId: getAdminDestinationById
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Destination details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDestinationDetailResponse'
        '404':
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update Destination
      description: Updates an existing destination's attributes, pricing, or status.
      operationId: updateAdminDestination
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDestinationRequest'
      responses:
        '200':
          description: Destination updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDestinationDetailResponse'
        '404':
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete Destination
      description: Deletes a destination (soft-delete by default, or permanent deletion with `?hard=true`).
      operationId: deleteAdminDestination
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hard
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Destination deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # ADMIN DESTINATION IMAGES MANAGEMENT
  # ==========================================
  /destinations/{id}/images:
    get:
      summary: List Destination Gallery Images
      description: Returns all gallery images associated with a destination, sorted by orderIndex.
      operationId: getDestinationImages
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Destination images retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationImageListResponse'
        '404':
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Upload or Add Image to Destination
      description: Adds a new image to destination gallery via multipart file upload or JSON payload with imageUrl reference.
      operationId: createDestinationImage
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                caption:
                  type: string
                altText:
                  type: string
                orderIndex:
                  type: integer
                isPrimary:
                  type: boolean
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationImageRequest'
      responses:
        '201':
          description: Image added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationImageDetailResponse'
        '400':
          description: Validation or upload error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /destinations/{id}/images/{imageId}:
    put:
      summary: Update Destination Image
      description: Updates image attributes (caption, altText, orderIndex, isPrimary) or replaces the image file.
      operationId: updateDestinationImage
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                caption:
                  type: string
                altText:
                  type: string
                orderIndex:
                  type: integer
                isPrimary:
                  type: boolean
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDestinationImageRequest'
      responses:
        '200':
          description: Destination image updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationImageDetailResponse'
        '404':
          description: Image or destination not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete Destination Image
      description: Deletes an image from the destination gallery.
      operationId: deleteDestinationImage
      tags:
        - Destinations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # ADMIN CATEGORIES MANAGEMENT
  # ==========================================
  /categories:
    get:
      summary: List Categories (Admin)
      description: Returns a paginated list of categories with destinations count and search capabilities.
      operationId: getAdminCategories
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, slug, createdAt, updatedAt, destinationsCount]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Category
      description: Creates a new tourism category with unique name and unique slug validation.
      operationId: createAdminCategory
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryDetailResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Category name or slug conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    get:
      summary: Get Category Details by ID or Slug
      description: Returns category details including the total number of assigned destinations.
      operationId: getAdminCategoryById
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryDetailResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update Category
      description: Updates category details with unique name/slug enforcement.
      operationId: updateAdminCategory
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryDetailResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name or slug collision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete Category
      description: Deletes a category. Rejects deletion with 409 Conflict if destinations are still using this category unless `?reassignTo=<categoryId>` is specified.
      operationId: deleteAdminCategory
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: reassignTo
          in: query
          description: Optional category ID to reassign associated destinations to before deletion
          schema:
            type: string
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardActionResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Category in use by destinations without reassignment target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter standard JWT Bearer token obtained from `/auth/login`

  schemas:
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@lombokexplorer.com
        password:
          type: string
          format: password
          example: Password123!

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AdminUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: usr_admin_001
        name:
          type: string
          example: Lombok Explorer Administrator
        email:
          type: string
          format: email
          example: admin@lombokexplorer.com
        role:
          type: string
          enum: [ADMIN]
          example: ADMIN
        avatarUrl:
          type: string
          nullable: true
          example: https://images.unsplash.com/photo-1534528741775-53994a69daeb
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        isEmailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-08-23T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-23T00:00:00.000Z"

    AdminAuthData:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          example: 900
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/AdminUserDto'

    AdminAuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          $ref: '#/components/schemas/AdminAuthData'

    AdminProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Admin profile retrieved successfully
        data:
          $ref: '#/components/schemas/AdminUserDto'

    StandardActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Admin access required
        errorCode:
          type: string
          example: ADMIN_ACCESS_REQUIRED
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example: null

    DashboardOverviewDto:
      type: object
      properties:
        totalUsers:
          type: integer
          example: 25
        totalDestinations:
          type: integer
          example: 35
        totalCategories:
          type: integer
          example: 13
        totalRestaurants:
          type: integer
          example: 8
        totalAccommodations:
          type: integer
          example: 7
        totalReviews:
          type: integer
          example: 50
        pendingReviews:
          type: integer
          example: 0
        totalItineraries:
          type: integer
          example: 15

    DashboardPeriodicMetricsDto:
      type: object
      properties:
        newUsers:
          type: integer
          example: 10
        newReviews:
          type: integer
          example: 12
        newItineraries:
          type: integer
          example: 5
        dateRange:
          type: object
          properties:
            startDate:
              type: string
              nullable: true
              example: "2026-01-01T00:00:00.000Z"
            endDate:
              type: string
              nullable: true
              example: "2026-12-31T23:59:59.999Z"

    DashboardPopularDestinationDto:
      type: object
      properties:
        id:
          type: string
          example: dest_tanjung_aan
        name:
          type: string
          example: Pantai Tanjung Aan
        slug:
          type: string
          example: pantai-tanjung-aan
        region:
          type: string
          example: LOMBOK_SELATAN
        categoryName:
          type: string
          example: Wisata Bahari & Pantai
        rating:
          type: number
          example: 4.8
        reviewCount:
          type: integer
          example: 32
        coverImageUrl:
          type: string
          example: https://images.unsplash.com/photo-1544644181-1484b3fdfc62

    DashboardFavoritedDestinationDto:
      type: object
      properties:
        id:
          type: string
          example: dest_tanjung_aan
        name:
          type: string
          example: Pantai Tanjung Aan
        slug:
          type: string
          example: pantai-tanjung-aan
        region:
          type: string
          example: LOMBOK_SELATAN
        categoryName:
          type: string
          example: Wisata Bahari & Pantai
        rating:
          type: number
          example: 4.8
        favoritesCount:
          type: integer
          example: 18
        coverImageUrl:
