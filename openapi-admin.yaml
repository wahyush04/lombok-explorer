  # ==========================================
  /audit-logs:
    get:
      summary: List Audit Logs (Admin)
      description: Returns paginated administrative audit trail logs with multi-dimensional filtering by admin, action, resource, entity, and date range.
      operationId: getAdminAuditLogs
      tags:
        - Audit Logs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Records per page (max 100)
          schema:
            type: integer
            default: 10
        - name: adminId
          in: query
          description: Filter by administrator user ID
          schema:
            type: string
        - name: action
          in: query
          description: Filter by action type (e.g. DESTINATION_CREATED, USER_SUSPENDED)
          schema:
            type: string
        - name: resource
          in: query
          description: Filter by resource/entity type (e.g. Destination, User, Category)
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter logs created on or after this ISO date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter logs created on or before this ISO date
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          description: Search term across action, entity, user, IP, or details
          schema:
            type: string
        - name: sortBy
          in: query
          description: Sort field
          schema:
            type: string
            enum: [createdAt, action, entity]
            default: createdAt
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin privileges required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

